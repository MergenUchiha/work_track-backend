# =============================================================
# WorkTrack Backend — docker compose stack: PostgreSQL + the NestJS API.
# Values come from .env; copy .env.example first.
# =============================================================

services:

  # ──────────────────────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: worktrack-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-worktrack}
      # No default on purpose: compose fails loudly instead of starting
      # production with a password that is published in this file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB:       ${POSTGRES_DB:-worktrack}
      # Locale and encoding for the initial database
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"

    volumes:
      # Persistent database files
      - postgres_data:/var/lib/postgresql/data
      # init scripts run only when the database is first created
      # - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql

    ports:
      # Bound to localhost: the database must never be reachable from outside
      # the host. Remove this mapping entirely in production.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worktrack} -d ${POSTGRES_DB:-worktrack}"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 10s

    networks:
      - worktrack-net

  # ──────────────────────────────────────────────────────────
  # WorkTrack NestJS Application
  # ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # target: production selects the final stage explicitly
      target: production

    container_name: worktrack-app
    restart: unless-stopped

    # Start only once the database reports healthy
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT:     ${PORT:-3000}

      # Assembled from the parts above so host, port and user are declared once
      DATABASE_URL: postgresql://${POSTGRES_USER:-worktrack}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-worktrack}

      # JWT
      JWT_ACCESS_SECRET:    ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET:   ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      CORS_ORIGINS:  ${CORS_ORIGINS:-http://localhost:3001}
      LOG_LEVEL:     ${LOG_LEVEL:-info}

    ports:
      - "${PORT:-3000}:3000"

    volumes:
      # Application logs
      - app_logs:/app/logs

    healthcheck:
      # /health/live does not touch the database and answers fast
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 30s
      timeout:  5s
      retries:  3
      start_period: 20s

    networks:
      - worktrack-net

    # Optional resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 128M

# ──────────────────────────────────────────────────────────────
# Named volumes
# ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: worktrack-postgres-data
  app_logs:
    name: worktrack-app-logs

# ──────────────────────────────────────────────────────────────
# Network
# ──────────────────────────────────────────────────────────────
networks:
  worktrack-net:
    name: worktrack-network
    driver: bridge